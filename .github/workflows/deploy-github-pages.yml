# Despliega la aplicación Angular a GitHub Pages (subruta /NOMBRE_REPO/).
# Requisitos en el repositorio:
# 1. Settings → Pages → Build: GitHub Actions
# 2. Settings → Secrets → Actions: VITE_COINGECKO_DEMO_API_KEY (clave demo de CoinGecko)
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_COINGECKO_DEMO_API_KEY: ${{ vars.COINGECKO_DEMO_API_KEY }}
        run: >
          npm run build --
          --base-href /${{ github.event.repository.name }}/

      - name: SPA fallback (rutas del router en GitHub Pages)
        run: |
          cp dist/marketwatch-lite/browser/index.html dist/marketwatch-lite/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/marketwatch-lite/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

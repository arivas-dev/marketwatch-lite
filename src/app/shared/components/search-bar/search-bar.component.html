<div class="relative w-full max-w-xl">
  <label class="sr-only" for="market-search">Buscar activos</label>
  <span
    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 dark:text-slate-500"
    aria-hidden="true"
  >
    <svg
      class="h-5 w-5"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M21 21l-5.2-5.2m2.2-5.3a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z"
      />
    </svg>
  </span>
  <input
    id="market-search"
    type="search"
    autocomplete="off"
    spellcheck="false"
    placeholder="Buscar por nombre, símbolo o id…"
    class="w-full rounded-2xl border border-slate-300/80 bg-white/70 py-3 pl-11 pr-4 text-sm text-slate-900 shadow-sm backdrop-blur-md placeholder:text-slate-400 transition focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400/30 dark:border-white/15 dark:bg-white/10 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-white/25 dark:focus:ring-white/20"
    [value]="query()"
    (input)="onInput($event)"
  />
</div>

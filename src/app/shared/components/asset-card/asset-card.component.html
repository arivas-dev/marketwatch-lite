<li
  class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm"
>
  <div class="flex items-center gap-3">
    <img
      class="h-10 w-10 shrink-0 rounded-full"
      [src]="coin().image"
      [alt]="coin().name"
      width="40"
      height="40"
      loading="lazy"
    />
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-medium text-gray-900">
        {{ coin().name }}
      </p>
      <p class="text-xs uppercase text-gray-500">
        {{ coin().symbol }}
      </p>
    </div>
  </div>
  <p class="mt-3 text-base font-semibold text-gray-900">
    {{ coin().current_price | currency: 'USD' : 'symbol' : '1.2-2' }}
  </p>
  <p
    class="mt-1 text-xs"
    [class.text-emerald-600]="coin().price_change_percentage_24h >= 0"
    [class.text-red-600]="coin().price_change_percentage_24h < 0"
  >
    {{ coin().price_change_percentage_24h | number: '1.2-2' }}% (24h)
  </p>
</li>

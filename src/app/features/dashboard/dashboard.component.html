<main
  class="relative mx-auto w-full max-w-6xl min-h-[calc(100dvh-3.5rem)] bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 px-4 py-8"
>
  <div
    class="pointer-events-none absolute inset-0 mx-auto max-w-6xl bg-[radial-gradient(ellipse_80%_50%_at_50%_-20%,rgba(148,163,184,0.14),transparent)]"
    aria-hidden="true"
  ></div>
  <ul
    class="relative grid w-full grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 lg:grid-cols-3"
  >
    @for (coin of coins(); track coin.id) {
      <li appAssetCard [coin]="coin"></li>
    }
  </ul>
</main>

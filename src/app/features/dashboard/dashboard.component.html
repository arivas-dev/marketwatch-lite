<main
  class="relative mx-auto flex w-full max-w-6xl flex-1 flex-col bg-gradient-to-br from-slate-100 via-white to-slate-100 px-4 py-8 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950"
>
  <div
    class="pointer-events-none absolute inset-0 mx-auto max-w-6xl bg-[radial-gradient(ellipse_80%_50%_at_50%_-20%,rgba(148,163,184,0.22),transparent)] dark:bg-[radial-gradient(ellipse_80%_50%_at_50%_-20%,rgba(148,163,184,0.14),transparent)]"
    aria-hidden="true"
  ></div>
  @if (loadError(); as err) {
    <div
      class="relative mb-5 w-full rounded-2xl border border-rose-500/25 bg-rose-500/10 px-4 py-3 text-sm text-rose-900 backdrop-blur-md dark:border-rose-400/30 dark:bg-rose-500/10 dark:text-rose-100"
      role="alert"
    >
      {{ err }}
    </div>
  }
  <ul
    class="relative grid w-full grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 lg:grid-cols-3"
    [attr.aria-busy]="isLoading()"
    [attr.aria-label]="isLoading() ? 'Loading market data' : 'Market assets'"
  >
    @if (isLoading()) {
      @for (i of skeletonPlaceholders; track i) {
        <li appAssetCardSkeleton></li>
      }
    } @else {
      @for (coin of coins(); track coin.id) {
        <li appAssetCard [coin]="coin"></li>
      }
    }
  </ul>
  @if (!loadError()) {
    <nav
      class="relative mt-8 flex w-full flex-wrap items-center justify-center gap-3"
      aria-label="Paginación del listado de mercado"
    >
      <button
        type="button"
        class="inline-flex min-h-11 min-w-[7rem] items-center justify-center rounded-xl border border-slate-300/80 bg-white/60 px-4 text-sm font-medium text-slate-800 shadow-sm backdrop-blur-md transition hover:bg-white/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-400 disabled:cursor-not-allowed disabled:opacity-45 dark:border-white/15 dark:bg-white/10 dark:text-slate-100 dark:hover:bg-white/15 dark:focus-visible:outline-slate-500"
        [disabled]="!canGoPrevious() || isLoading()"
        (click)="goToPreviousPage()"
      >
        Anterior
      </button>
      <span
        class="inline-flex min-h-11 items-center rounded-xl border border-slate-200/80 bg-white/50 px-5 text-sm tabular-nums text-slate-700 backdrop-blur-md dark:border-white/15 dark:bg-white/10 dark:text-slate-200"
      >
        Página {{ currentPage() }}
      </span>
      <button
        type="button"
        class="inline-flex min-h-11 min-w-[7rem] items-center justify-center rounded-xl border border-slate-300/80 bg-white/60 px-4 text-sm font-medium text-slate-800 shadow-sm backdrop-blur-md transition hover:bg-white/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-400 disabled:cursor-not-allowed disabled:opacity-45 dark:border-white/15 dark:bg-white/10 dark:text-slate-100 dark:hover:bg-white/15 dark:focus-visible:outline-slate-500"
        [disabled]="!hasNextPage() || isLoading()"
        (click)="goToNextPage()"
      >
        Siguiente
      </button>
    </nav>
  }
</main>

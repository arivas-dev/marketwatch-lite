<main
  class="relative mx-auto flex w-full max-w-6xl flex-1 flex-col bg-gradient-to-br from-slate-100 via-white to-slate-100 px-4 py-8 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950"
>
  <div
    class="pointer-events-none absolute inset-0 mx-auto max-w-6xl bg-[radial-gradient(ellipse_80%_50%_at_50%_-20%,rgba(148,163,184,0.22),transparent)] dark:bg-[radial-gradient(ellipse_80%_50%_at_50%_-20%,rgba(148,163,184,0.14),transparent)]"
    aria-hidden="true"
  ></div>
  <ul
    class="relative grid w-full grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 lg:grid-cols-3"
    [attr.aria-busy]="isLoading()"
    [attr.aria-label]="isLoading() ? 'Loading market data' : 'Market assets'"
  >
    @if (isLoading()) {
      @for (i of skeletonPlaceholders; track i) {
        <li appAssetCardSkeleton></li>
      }
    } @else {
      @for (coin of coins(); track coin.id) {
        <li appAssetCard [coin]="coin"></li>
      }
    }
  </ul>
</main>
